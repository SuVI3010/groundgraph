name: groundgraph

services:
  falkordb:
    image: ${FALKORDB_IMAGE:-docker.io/falkordb/falkordb:6.0.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3000}:3000"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      AUTH_SECRET: "groundgraph-local-browser-session"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-5050}:5050"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_MODE: server
      FALKORDB_LITE_PATH: /app/.data/groundgraph.db
      FALKORDB_PORT: 6379
      FALKORDB_PASSWORD: "${FALKORDB_PASSWORD:-}"
      FALKORDB_GRAPH: "${FALKORDB_GRAPH:-groundgraph}"
      GROUNDGRAPH_DATA: /app/data/scenario.json
      GROUNDGRAPH_ENABLE_LLM: "${GROUNDGRAPH_ENABLE_LLM:-1}"
      GROUNDGRAPH_AUTO_APPLY: "${GROUNDGRAPH_AUTO_APPLY:-1}"
      OLLAMA_URL: "${OLLAMA_CONTAINER_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b-instruct}"
      PORT: 5050
    volumes:
      - app-data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

  ollama:
    profiles: ["local-llm"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  falkordb-data:
  ollama-data:
  app-data:

